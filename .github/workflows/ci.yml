name: ci
on: [push, pull_request]
jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: syntax check all modules
        # Build-time tokens (/*__AUTH_ENABLED__*/ and /*__EDITION_MARKER__*/,
        # replaced by scripts/build.mjs during assembly) sit in expression
        # position in src/game/auth.mjs and src/game/title.mjs, so those
        # sources are intentionally NOT standalone-parseable. Check every
        # module with the tokens neutralized to `null` in a temp copy —
        # full coverage, and the build step below validates the real thing.
        run: |
          for f in $(find src scripts api -name '*.mjs'); do
            tmp=$(mktemp --suffix=.mjs)
            sed -E 's#/\*__[A-Z_]+__\*/#null#g' "$f" > "$tmp"
            node --check "$tmp" || { echo "syntax FAIL: $f"; rm -f "$tmp"; exit 1; }
            rm -f "$tmp"
          done
      - name: build (zero-dep)
        run: node scripts/build.mjs
      - name: budget gates
        run: node scripts/budgets-check.mjs
      - name: contamination scan
        run: node scripts/contamination-scan.mjs
      - name: bundle drift gate
        run: node scripts/drift-gate.mjs
      - name: headless slice playthrough
        run: node scripts/verify-slice.mjs
      - name: install api deps (pinned, server-only)
        run: npm ci --no-audit --no-fund
      - name: npm audit (HIGH/CRITICAL fail the job)
        # api deps are pinned in the root package.json (server-only); the game
        # client ships zero dependencies.
        run: npm audit --audit-level=high
      - name: install-script ban (LCR condition 6)
        # No package.json anywhere in the repo may declare preinstall/install/
        # postinstall scripts (supply-chain bar, AppSec C13).
        run: |
          hits=$(grep -rE '"(preinstall|install|postinstall)"[[:space:]]*:' --include="package.json" . --exclude-dir=node_modules || true)
          if [ -n "$hits" ]; then echo "install-script ban FAILED:"; echo "$hits"; exit 1; fi
          echo "install-script ban: PASS"
      - name: single-validator gate (LCR condition 8)
        # Exactly two validators may exist: the client pre-check
        # (src/save/schema.mjs) and the authoritative server gate
        # (api/_lib/validator.mjs). Parity status is documented honestly in
        # api/README.md ("Save contract" > Validator).
        run: |
          defs=$(grep -rln -E "function validateSave" src/save api/_lib --include="*.mjs" | sort)
          echo "$defs"
          expected=$(printf 'api/_lib/validator.mjs\nsrc/save/schema.mjs')
          [ "$defs" = "$expected" ] || { echo "single-validator gate FAILED"; exit 1; }
          echo "single-validator gate: PASS"
      - name: validator table snapshot freshness
        run: node tools/api-scripts/gen-tables.mjs --check
      - name: api unit tests (validator)
        run: node tools/api-scripts/validator.test.mjs
      - name: api fuzz test (validator, seeded N=2000)
        run: node tools/api-scripts/validator.fuzz.test.mjs
      - name: api unit tests (save contract F1)
        run: node tools/api-scripts/save-contract.test.mjs
      - name: api unit tests (auth config)
        run: node tools/api-scripts/config.test.mjs
      - name: api unit tests (http + ip)
        run: node tools/api-scripts/http-ip.test.mjs
      - name: api fail-closed test (no DATABASE_URL)
        run: env -u DATABASE_URL node tools/api-scripts/failclosed.test.mjs
      - name: api coverage report (log-only; honest number in fuzz test header)
        # Records branch coverage; the aggregate number is written into
        # tools/api-scripts/validator.fuzz.test.mjs's header comment. Log-only:
        # coverage is reported, never chased artificially.
        run: env -u DATABASE_URL node --experimental-test-coverage --test tools/api-scripts/validator.test.mjs tools/api-scripts/validator.fuzz.test.mjs tools/api-scripts/config.test.mjs tools/api-scripts/http-ip.test.mjs tools/api-scripts/save-contract.test.mjs tools/api-scripts/failclosed.test.mjs
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
