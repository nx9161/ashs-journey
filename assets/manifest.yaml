# Asset provenance manifest — Ash's Journey
# Every asset gets lineage: generator + version, seed, hand-finish author + date.
# Lead Code Reviewer signs provenance; General Counsel signs IP clearance (Phase 4 gate).
# Format per batch: one entry per asset family. `status: placeholder` assets are
# programmatic stand-ins that MUST be replaced by Art Director / Voice Designer
# output before any owner-visible sign-off (see docs/contracts.md).

version: 1
project: ashs-journey
ip_posture: 100% original code/art/audio. No ripped sprites, no ROM-derived data,
  no sampled audio, no copied scripts. All research from docs/wikis only.

assets:
  - id: overworld-tiles-v1
    kind: tiles
    status: hand-authored
    source: hand-authored
    generator: assets/sprites/tools/build-art.mjs (ArtForge pipeline v1)
    seed: tiles hand-finished from forge-base drafts (seeds 1001/1078/1155); others n/a
    hand_finish: Art Director (seat 33 "Psylocke")
    author: Art Director (seat 33 "Psylocke"), Phase 4 Wave 2
    date: 2026-10-15
    ai_assisted: true
    palette_audit: tileset <= 16 colors (verified by palette-audit.mjs); no gradients;
      1px dark outline; no orphans; 1px transparent margin.
    notes: 13 hand-authored 16x16 tiles (grass/path/tree/water-1/water-2 animated/
      house/door/sign/gymwall/gymdoor/centerdoor/flower/rock). Replaces producer
      placeholder. Atlases: assets/sprites/dist/atlas-tiles.png.

